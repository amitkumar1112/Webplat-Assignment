<div class="login-container">
   <figure>
      <img src="assets/images/logo.png" alt="">
   </figure>
   <div class="brder">

      <div class="login-card">
         <div class="login-title">
            <h2>WELCOME BACK</h2>
            <p>Please login to your account</p>
         </div>

         <div class="login-inp" [formGroup]="loginForm">
            <input matInput type="text" formControlName="Username" class="login-inp-field" placeholder="USERNAME">
            <div class="error" *ngIf="submitted && loginForm.get('Username')?.hasError('required')">Username is Required
            </div>
            <input matInput type="password" formControlName="password" class="login-inp-field" placeholder="PASSWORD">
            <div class="error" *ngIf="submitted && loginForm.get('password')?.hasError('required')">Password is Required
            </div>

         </div>
         <div class="login-spn">
            <mat-checkbox><span style="color: #8d999b;">Remember Me</span></mat-checkbox>
            <span>Forgot password?</span>
         </div>

         <div class="login-btn-wrapper">
            <button (click)="btn_submit()" class="login-btn"><svg width="22" height="16" viewBox="0 0 22 23" fill="none"
                  xmlns="http://www.w3.org/2000/svg">
                  <path
                     d="M5.31068 11.9393H0.866361C0.393801 11.9393 0 11.5624 0 11.0857C0 10.6201 0.393801 10.2321 0.866361 10.2321H5.31068L5.31102 4.93319C5.31102 2.21716 7.60056 0 10.4052 0H15.9917C18.785 0 21.063 2.21716 21.063 4.9221V17.2495C21.063 19.9656 18.785 22.1716 15.9688 22.1716H10.3938C7.60056 22.1716 5.31102 19.9656 5.31102 17.2606L5.31068 11.9393L12.4086 11.9394L10.577 13.7132C10.2335 14.0457 10.2335 14.5889 10.577 14.9215C10.7487 15.0878 10.9776 15.1654 11.2066 15.1654C11.4241 15.1654 11.653 15.0878 11.8248 14.9215L15.1675 11.6955C15.3392 11.5403 15.4308 11.3186 15.4308 11.0858C15.4308 10.8641 15.3392 10.6424 15.1675 10.4872L11.8248 7.26121C11.4813 6.92863 10.9204 6.92863 10.577 7.26121C10.2335 7.59378 10.2335 8.13699 10.577 8.46956L12.4086 10.2322L5.31068 10.2321V11.9393Z"
                     fill="white" />
               </svg>
               LOGIN</button>
         </div>

         <p class="login-reg">Don't have an account?&nbsp;<span style="color: red;">Sign Up</span></p>
      </div>
   </div>

</div>
